# Gestion-de-taxis-et-livraisons
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - Test</title>
</head>
<body>

    <h2>Formulaire d'inscription (test-branch)</h2>

    <form onsubmit="inscription(); return false;">
        <label>Nom :</label><br>
        <input type="text" id="nom" required><br><br>

        <label>Email :</label><br>
        <input type="email" id="email" required><br><br>

        <label>Mot de passe :</label><br>
        <input type="password" id="password" required><br><br>

        <button type="submit">S'inscrire</button>
    </form>

    <p id="resultat"></p>

    <script>
        function inscription() {
            const nom = document.getElementById("nom").value;
            const email = document.getElementById("email").value;

            document.getElementById("resultat").innerText =
                "✅ Inscription réussie pour " + nom + " (" + email + ")";
        }
    </script>

</body>
</html>
